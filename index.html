<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باحث العمران المتقدم | دليل المدارس والمدراء</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --omran-green: #007A3D;
            --omran-green-dark: #005A2C;
            --omran-green-light: #E8F5E9;
            --omran-dark: #232223;
            --omran-gray: #4A4A4A;
            --omran-gray-light: #F4F6F8;
            --omran-border: #E2E8F0;
            --white: #FFFFFF;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 12px 30px rgba(0, 122, 61, 0.12);
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F8FAF9;
            color: var(--omran-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
            border-bottom: 4px solid var(--omran-green);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .logo-img {
            height: 48px;
            background: #FFFFFF;
            padding: 5px 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            object-fit: contain;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            color: #FFFFFF;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-title .highlight {
            color: #2ECC71;
        }

        .app-subtitle {
            color: #A0AEC0;
            font-size: 13px;
            font-weight: 500;
        }

        .stats-badge {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 3px 10px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-right: auto;
        }

        .stats-badge i {
            font-size: 10px;
            color: #64748B;
        }

        .stats-badge span {
            color: #2ECC71;
            font-weight: 800;
            font-size: 12px;
        }

        /* Search & Hero */
        .search-hero {
            background: linear-gradient(180deg, #FFFFFF 0%, #F4F7F5 100%);
            padding: 24px 24px 18px 24px;
            border-bottom: 1px solid var(--omran-border);
        }

        .search-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box {
            width: 100%;
            padding: 16px 52px 16px 20px;
            border: 2px solid #E2E8F0;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 600;
            background: #FFFFFF;
            color: var(--omran-dark);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--omran-green);
            box-shadow: 0 0 0 4px rgba(0, 122, 61, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--omran-green);
            font-size: 20px;
        }

        .clear-btn {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: #E2E8F0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: #64748B;
            font-size: 12px;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #CBD5E1;
            color: #1E293B;
        }

        /* Filter Controls */
        .filter-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .filter-chip {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--omran-border);
            background: #FFFFFF;
            color: var(--omran-gray);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .filter-chip:hover {
            border-color: var(--omran-green);
            color: var(--omran-green);
        }

        .filter-chip.active {
            background: var(--omran-green);
            color: #FFFFFF;
            border-color: var(--omran-green);
            box-shadow: 0 4px 12px rgba(0, 122, 61, 0.25);
        }

        .select-filter {
            padding: 9px 16px;
            border-radius: 12px;
            border: 1px solid var(--omran-border);
            background: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            color: var(--omran-dark);
            outline: none;
            cursor: pointer;
            min-width: 180px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            text-align: center;
        }

        .select-filter:focus {
            border-color: var(--omran-green);
        }

        /* Main Content */
        main {
            max-width: 1300px;
            margin: 22px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .results-count {
            font-size: 15px;
            font-weight: 700;
            color: var(--omran-dark);
        }

        .results-count span {
            color: var(--omran-green);
            font-size: 18px;
        }

        /* Schools Grid */
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .school-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--omran-border);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .school-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(0, 122, 61, 0.4);
        }

        .card-top-bar {
            padding: 12px 18px;
            background: #FAFCFA;
            border-bottom: 1px solid #EDF2F7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .school-code-badge {
            background: #E8F5E9;
            color: var(--omran-green);
            font-weight: 800;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 122, 61, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tags-row {
            display: flex;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .tag-gender-male {
            background: #EBF8FF;
            color: #2B6CB0;
        }

        .tag-gender-female {
            background: #FFF5F7;
            color: #D53F8C;
        }

        .tag-stage {
            background: #F7FAFC;
            color: #4A5568;
            border: 1px solid #E2E8F0;
        }

        .card-body {
            padding: 18px 18px 14px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .school-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--omran-dark);
            line-height: 1.4;
        }

        .school-info-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            color: var(--omran-gray);
            background: #F8FAFC;
            padding: 10px 12px;
            border-radius: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item i {
            color: var(--omran-green);
            font-size: 13px;
        }

        /* Director Box */
        .director-box {
            background: #FCFDFD;
            border: 1.5px dashed #CBD5E1;
            border-radius: var(--radius-md);
            padding: 12px;
            margin-top: 4px;
            transition: all 0.2s;
        }

        .director-box.has-director {
            border-color: #A7F3D0;
            background: #F0FDF4;
        }

        .director-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .director-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--omran-green);
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        .director-status-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .status-assigned {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-unassigned {
            background: #F1F5F9;
            color: #64748B;
        }

        .director-name {
            font-size: 15px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 6px;
        }

        .director-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #475569;
            padding: 2px 0;
        }

        .detail-key {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        .detail-copy-btn {
            background: #E8F5E9;
            border: 1px solid rgba(0, 122, 61, 0.2);
            color: var(--omran-green);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .detail-copy-btn:hover {
            background: var(--omran-green);
            color: #FFFFFF;
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(0, 122, 61, 0.25);
        }

        .detail-val {
            font-weight: 700;
            font-family: monospace, sans-serif;
            font-size: 13px;
            color: #0F172A;
            direction: ltr;
        }

        /* Card Footer */
        .card-footer {
            padding: 12px 18px;
            background: #FAFCFA;
            border-top: 1px solid #EDF2F7;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            flex: 1;
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-maps {
            background: #2563EB;
            color: #FFFFFF;
        }

        .btn-maps:hover {
            background: #1D4ED8;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .btn-call {
            background: var(--omran-green);
            color: #FFFFFF;
        }

        .btn-call:hover {
            background: var(--omran-green-dark);
            box-shadow: 0 4px 10px rgba(0, 122, 61, 0.2);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #FFFFFF;
            flex: 0 0 40px;
            padding: 9px 0;
            font-size: 15px;
        }

        .btn-whatsapp:hover {
            background: #1EBE5D;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-copy {
            background: #F1F5F9;
            color: #475569;
            flex: 0 0 40px;
            padding: 9px 0;
            font-size: 13px;
        }

        .btn-copy:hover {
            background: #E2E8F0;
            color: #1E293B;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            border: 2px dashed #CBD5E1;
        }

        .empty-state i {
            font-size: 44px;
            color: #94A3B8;
            margin-bottom: 14px;
        }

        .empty-state h3 {
            font-size: 19px;
            font-weight: 800;
            color: #334155;
            margin-bottom: 6px;
        }

        .empty-state p {
            color: #64748B;
            font-size: 13px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1E293B;
            color: #FFFFFF;
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Footer */
        footer {
            background: #FFFFFF;
            border-top: 1px solid var(--omran-border);
            padding: 18px 24px;
            text-align: center;
            margin-top: auto;
            color: #64748B;
            font-size: 13px;
            font-weight: 600;
        }

        footer span {
            color: var(--omran-green);
            font-weight: 800;
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 14px;
            }
            .header-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .brand-wrapper {
                gap: 10px;
            }
            .app-title {
                font-size: 16px;
            }
            .app-subtitle {
                font-size: 10px;
            }
            .logo-img {
                height: 36px;
                padding: 3px 6px;
            }
            .stats-badge {
                margin-right: 0;
                padding: 3px 8px;
                font-size: 10px;
                border-radius: 12px;
            }
            .stats-badge span {
                font-size: 11px;
            }
            .search-hero {
                padding: 16px 14px;
            }
            .search-box {
                font-size: 14px;
                padding: 13px 44px 13px 14px;
            }
            .search-icon {
                right: 14px;
                font-size: 17px;
            }
            .filter-row {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .filter-group {
                width: 100%;
                justify-content: center;
                gap: 6px;
            }
            .filter-chip {
                padding: 6px 14px;
                font-size: 12px;
            }
            .select-filter {
                width: 48%;
                min-width: 130px;
                font-size: 12px;
                padding: 8px 10px;
            }
            main {
                padding: 0 14px;
                margin: 16px auto;
            }
            .schools-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .school-card {
                border-radius: 16px;
            }
            .school-title {
                font-size: 15px;
            }
            .card-body {
                padding: 14px;
            }
            .card-footer {
                padding: 10px 14px;
            }
        }
    </style>
</head>

 "schoolNo": 251, "moeCode": "24193", "schoolName": "الامام مالك", "facilityType": "مشترك ملحق", "schoolGender": "بنين", "stage": "متوسط", "ownership": "حكومي", "district": "العسيله", "sector": "وادي الدواسر", "googleMapsUrl": "https://maps.app.goo.gl/kfAtUiFZJC6LNhwU9", "lat": 20.583937, "lng": 45.094172, "manager": {"name": "محمد خالد ناصر الهاجري", "national_id": "1088285737", "phone": "0507845977", "email": "t375714@rb.moe.gov.sa", "notes": "", "has_manager": true}}, {"id": "sch_252", "schoolNo": 252, "moeCode": "241845", "schoolName": "السليل", "facilityType": "مستقل", "schoolGender": "بنين", "stage": "ثانوي", "ownership": "حكومي", "district": "ال محمد", "sector": "وادي الدواسر", "googleMapsUrl": "https://maps.app.goo.gl/PaWcWyi8DHFhJEPFA?g_st=ac", "lat": 20.479969, "lng": 45.546031, "manager": {"name": "عبدالرحمن بن عائض صالح العمري", "national_id": "1002508016", "phone": "0509820048", "email": "p131289@rb.moe.gov.sa", "notes": "", "has_manager": true}}, {"id": "sch_253", "schoolNo": 253, "moeCode": "124020", "schoolName": "ابن تيمية", "facilityType": "مستقل", "schoolGender": "بنين", "stage": "ثانوي", "ownership": "حكومي", "district": "ال حجي", "sector": "وادي الدواسر", "googleMapsUrl": "https://maps.app.goo.gl/qoBmVei2Cx359jWi6?g_st=ac", "lat": 20.462162, "lng": 45.559578, "manager": {"name": "محمد إبراهيم الشابع الدوسري", "national_id": "1087393771", "phone": "0500565950", "email": "Ts19191919@rb.moe.gov.sa", "notes": "", "has_manager": true}}];

        let currentGenderFilter = 'all';
        let currentStageFilter = '';
        let currentDistrictFilter = '';
        let searchQuery = '';

        // Elements
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const stageFilter = document.getElementById('stageFilter');
        const districtFilter = document.getElementById('districtFilter');
        const schoolsGrid = document.getElementById('schoolsGrid');
        const visibleCountSpan = document.getElementById('visibleCount');
        const headerTotalCount = document.getElementById('headerTotalCount');
        const headerManagerCount = document.getElementById('headerManagerCount');
        const filterChips = document.querySelectorAll('.filter-chip');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function initData() {
            if (headerTotalCount) headerTotalCount.textContent = schoolsData.length;
            if (headerManagerCount) {
                const managersTotal = schoolsData.filter(s => s.manager && s.manager.has_manager).length;
                headerManagerCount.textContent = managersTotal;
            }

            // Populate unique districts
            const districts = [...new Set(schoolsData.map(s => s.district).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ar'));
            districts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                districtFilter.appendChild(opt);
            });

            renderSchools();
        }

        function getFilteredSchools() {
            const q = searchQuery.trim().toLowerCase();
            return schoolsData.filter(sch => {
                if (q) {
                    const code = (sch.moeCode || '').toLowerCase();
                    const name = (sch.schoolName || '').toLowerCase();
                    const district = (sch.district || '').toLowerCase();
                    const stage = (sch.stage || '').toLowerCase();
                    const mgrName = (sch.manager && sch.manager.name ? sch.manager.name : '').toLowerCase();
                    const mgrId = (sch.manager && sch.manager.national_id ? sch.manager.national_id : '').toLowerCase();
                    const mgrPhone = (sch.manager && sch.manager.phone ? sch.manager.phone : '').toLowerCase();

                    const matches = code.includes(q) || 
                                    name.includes(q) || 
                                    district.includes(q) || 
                                    stage.includes(q) || 
                                    mgrName.includes(q) || 
                                    mgrId.includes(q) || 
                                    mgrPhone.includes(q);
                    if (!matches) return false;
                }

                if (currentGenderFilter === 'with-manager') {
                    if (!sch.manager || !sch.manager.has_manager) return false;
                } else if (currentGenderFilter === 'boys') {
                    if (sch.schoolGender !== 'بنين') return false;
                } else if (currentGenderFilter === 'girls') {
                    if (sch.schoolGender !== 'بنات') return false;
                }

                if (currentStageFilter && sch.stage !== currentStageFilter) {
                    return false;
                }

                if (currentDistrictFilter && sch.district !== currentDistrictFilter) {
                    return false;
                }

                return true;
            });
        }

        function renderSchools() {
            const filtered = getFilteredSchools();
            visibleCountSpan.textContent = filtered.length;

            if (filtered.length === 0) {
                schoolsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <h3>لا توجد نتائج مطابقة للبحث</h3>
                        <p>جرّب تعديل كلمات البحث أو إزالة الفلاتر المحددة</p>
                    </div>
                `;
                return;
            }

            const html = filtered.map(sch => {
                const hasMgr = sch.manager && sch.manager.has_manager;
                const mgr = sch.manager || {};
                const isMale = sch.schoolGender === 'بنين';
                const genderClass = isMale ? 'tag-gender-male' : 'tag-gender-female';

                let mapsUrl = sch.googleMapsUrl;
                if (!mapsUrl && sch.lat && sch.lng) {
                    mapsUrl = `https://www.google.com/maps/search/?api=1&query=${sch.lat},${sch.lng}`;
                }

                return `
                    <div class="school-card">
                        <div class="card-top-bar">
                            <div class="school-code-badge">
                                <i class="fa-solid fa-hashtag"></i>
                                <span>${sch.moeCode || 'بدون رقم'}</span>
                            </div>
                            <div class="tags-row">
                                <span class="tag ${genderClass}">${sch.schoolGender || 'غير محدد'}</span>
                                <span class="tag tag-stage">${sch.stage || 'عام'}</span>
                            </div>
                        </div>

                        <div class="card-body">
                            <h3 class="school-title">${sch.schoolName || 'مدرسة'}</h3>
                            
                            <div class="school-info-items">
                                <div class="info-item">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <span>الحي: <strong>${sch.district || 'غير محدد'}</strong></span>
                                </div>
                                <div class="info-item">
                                    <i class="fa-solid fa-city"></i>
                                    <span>القطاع: <strong>${sch.sector || 'وادي الدواسر'}</strong></span>
                                </div>
                                <div class="info-item">
                                    <i class="fa-solid fa-building"></i>
                                    <span>المبنى: <strong>${sch.ownership || 'حكومي'}</strong></span>
                                </div>
                                <div class="info-item">
                                    <i class="fa-solid fa-shapes"></i>
                                    <span>النوع: <strong>${sch.facilityType || 'مستقل'}</strong></span>
                                </div>
                            </div>

                            <div class="director-box ${hasMgr ? 'has-director' : ''}">
                                <div class="director-header">
                                    <div class="director-label">
                                        <i class="fa-solid fa-user-tie"></i>
                                        بيانات المدير
                                    </div>
                                    <span class="director-status-pill ${hasMgr ? 'status-assigned' : 'status-unassigned'}">
                                        ${hasMgr ? 'مسكّن بالنظام' : 'غير مسجل'}
                                    </span>
                                </div>

                                ${hasMgr ? `
                                    <div class="director-name">${mgr.name}</div>
                                    <div class="director-details">
                                        <div class="detail-row">
                                            <div class="detail-key">
                                                <button class="detail-copy-btn" onclick="copyText('${mgr.national_id || ''}', 'تم نسخ السجل المدني بنجاح')" title="نسخ السجل المدني">
                                                    <i class="fa-solid fa-copy"></i>
                                                </button>
                                                <i class="fa-solid fa-id-card" style="color: var(--omran-green);"></i>
                                                <span>السجل المدني:</span>
                                            </div>
                                            <span class="detail-val">${mgr.national_id || '-'}</span>
                                        </div>
                                        <div class="detail-row">
                                            <div class="detail-key">
                                                <button class="detail-copy-btn" onclick="copyText('${mgr.phone || ''}', 'تم نسخ رقم الجوال بنجاح')" title="نسخ رقم الجوال">
                                                    <i class="fa-solid fa-copy"></i>
                                                </button>
                                                <i class="fa-solid fa-phone" style="color: var(--omran-green);"></i>
                                                <span>رقم الجوال:</span>
                                            </div>
                                            <span class="detail-val">${mgr.phone || '-'}</span>
                                        </div>
                                    </div>
                                ` : `
                                    <div style="font-size: 13px; color: #94A3B8; text-align: center; padding: 6px 0;">
                                        لا توجد بيانات مسجلة لمدير هذه المدرسة
                                    </div>
                                `}
                            </div>
                        </div>

                        <div class="card-footer">
                            ${mapsUrl ? `
                                <a href="${mapsUrl}" target="_blank" class="btn btn-maps" title="فتح الموقع في خرائط Google">
                                    <i class="fa-solid fa-map-location-dot"></i>
                                    الموقع
                                </a>
                            ` : ''}

                            ${hasMgr && mgr.phone ? `
                                <a href="tel:${mgr.phone}" class="btn btn-call" title="اتصال بالمدير">
                                    <i class="fa-solid fa-phone"></i>
                                    اتصال
                                </a>
                                <a href="https://wa.me/966${mgr.phone.startsWith('0') ? mgr.phone.substring(1) : mgr.phone}" target="_blank" class="btn btn-whatsapp" title="مراسلة عبر واتساب">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </a>
                            ` : ''}

                            <button class="btn btn-copy" onclick="copySchoolInfo('${sch.moeCode}')" title="نسخ معلومات المدرسة والمدير">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            schoolsGrid.innerHTML = html;
        }

        window.copyText = function(text, successMsg) {
            if (!text || text === '-') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg || 'تم النسخ بنجاح');
            }).catch(() => {
                const input = document.createElement('textarea');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast(successMsg || 'تم النسخ بنجاح');
            });
        };

        window.copySchoolInfo = function(code) {
            const sch = schoolsData.find(s => s.moeCode === code);
            if (!sch) return;

            let text = `🏫 مدرسة: ${sch.schoolName}\n`;
            text += `🔢 الرقم الوزاري: ${sch.moeCode}\n`;
            text += `📍 الحي: ${sch.district || '-'}\n`;
            text += `📚 المرحلة: ${sch.stage} (${sch.schoolGender})\n`;
            
            if (sch.manager && sch.manager.has_manager) {
                text += `👤 المدير: ${sch.manager.name}\n`;
                text += `🪪 الهوية: ${sch.manager.national_id}\n`;
                text += `📱 الجوال: ${sch.manager.phone}\n`;
            }

            if (sch.googleMapsUrl) {
                text += `🗺️ اللوكيشن: ${sch.googleMapsUrl}\n`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('تم نسخ بيانات المدرسة والمدير بنجاح');
            }).catch(() => {
                // fallback
                showToast('تم النسخ');
            });
        };

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearchBtn.style.display = searchQuery ? 'flex' : 'none';
            renderSchools();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.style.display = 'none';
            renderSchools();
            searchInput.focus();
        });

        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentGenderFilter = chip.getAttribute('data-filter');
                renderSchools();
            });
        });

        stageFilter.addEventListener('change', (e) => {
            currentStageFilter = e.target.value;
            renderSchools();
        });

        districtFilter.addEventListener('change', (e) => {
            currentDistrictFilter = e.target.value;
            renderSchools();
        });

        initData();
    </script>
</body>
</html>
